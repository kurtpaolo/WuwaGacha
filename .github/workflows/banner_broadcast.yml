name: Half-Hourly Banner Broadcast

on:
  schedule:
    # Runs at minute 0 and minute 30 of every hour (UTC / GMT+8 aligned)
    - cron: '0,30 * * * *'
  workflow_dispatch:

jobs:
  broadcast:
    name: Trigger Convene Banner Webhooks
    runs-on: ubuntu-latest
    steps:
      - name: Send Banner Broadcast Request
        run: |
          TARGET_URL="${{ secrets.VERCEL_APP_URL || 'https://wuwa-sim.vercel.app' }}/api/banner/broadcast"
          echo "Broadcasting banner rotation to Discord webhooks via: $TARGET_URL"
          
          if [ -n "${{ secrets.CRON_SECRET || secrets.BROADCAST_SECRET }}" ]; then
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET || secrets.BROADCAST_SECRET }}" \
              -H "Content-Type: application/json")
          else
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$TARGET_URL" \
              -H "Content-Type: application/json")
          fi
          
          HTTP_BODY=$(echo "$RESPONSE" | sed -e '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Response Body: $HTTP_BODY"
          echo "HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Error: Broadcast request failed with status $HTTP_STATUS"
            exit 1
          fi
